[project]
name = "concertpub"
version = "0.1.0"
description = "Cut a concert recording (camera + field recorder + programme PDF) into named per-piece FLAC/MP4 files and a Kdenlive project"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["concert", "choir", "audio", "video", "kdenlive", "ffmpeg", "sync", "segmentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pypdf>=4.0",
    "opentimelineio>=0.17",
    "torch>=2.2",
    "panns-inference>=0.1.1",
]

[project.scripts]
concertpub = "concertpub.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concertpub"]

# CPU-only torch: avoids downloading several GB of CUDA libraries. No GPU needed.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
