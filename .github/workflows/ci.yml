name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      # CPU-only PyTorch comes from the index pinned in pyproject.toml; the tests use
      # synthetic data and need neither ffmpeg nor the detector model.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
